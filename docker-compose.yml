services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juass
      POSTGRES_PASSWORD: juass
      POSTGRES_DB: juass_tablets
    ports:
      - "5432:5432"
    volumes:
      - juass_db_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://juass:juass@db:5432/juass_tablets
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: uploads
      SCHOOL_NAME: Juaben Senior High School
      # This is a local-network deployment (e.g. a laptop at a distribution
      # event with no internet). Set these so it automatically pushes its
      # data to your cloud instance every few minutes — see .env.example for
      # what these mean and how to generate SYNC_SECRET. Leave unset to run
      # purely local with no auto-sync (use Settings > Download Full Backup
      # manually instead).
      REMOTE_SYNC_URL: ${REMOTE_SYNC_URL:-}
      SYNC_SECRET: ${SYNC_SECRET:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
    ports:
      - "4000:4000"
    volumes:
      - juass_uploads:/app/server/uploads

volumes:
  juass_db_data:
  juass_uploads:
