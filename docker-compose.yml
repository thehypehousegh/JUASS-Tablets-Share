services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juass
      POSTGRES_PASSWORD: juass
      POSTGRES_DB: juass_tablets
    ports:
      - "5432:5432"
    volumes:
      - juass_db_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://juass:juass@db:5432/juass_tablets
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: uploads
      SCHOOL_NAME: Juaben Senior High School
    ports:
      - "4000:4000"
    volumes:
      - juass_uploads:/app/uploads

volumes:
  juass_db_data:
  juass_uploads:
